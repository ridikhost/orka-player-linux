[package]
name = "orka-player-linux"
version = "2.4.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "blocking"] }
chrono = "0.4"
eframe = "0.28"
rodio = "0.17"
rfd = "0.14"
